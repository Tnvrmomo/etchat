name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25c
          build-tools-version: 34.0.0
      
      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build web assets
        run: npm run build
      
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
      
      - name: Install Capacitor packages
        run: npm install @capacitor/core @capacitor/android --legacy-peer-deps
      
      - name: Add Android platform
        run: npx cap add android --web-dir=dist 2>/dev/null || true
      
      - name: Sync Capacitor
        run: npx cap sync --deployment
      
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2.1
      
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon -x lint
      
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            echo "Build outputs:"
            find android/app/build/outputs -type f 2>/dev/null || echo "No outputs found"
            exit 1
          fi
          echo "✅ APK built successfully!"
          ls -lh "$APK_PATH"
          file "$APK_PATH"
      
      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: etchat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
      
      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: apk-build-${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📱 etChat Android APK - Build #${{ github.run_number }}
            
            **Status:** ✅ Build Successful
            **Built:** ${{ github.event.head_commit.timestamp }}
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            ### 🚀 Installation
            ```bash
            adb install -r app-debug.apk
            ```
            
            ### ✨ Features
            - Google Meet-style call codes (abc-def-ghi format)
            - Real-time P2P video calling via WebRTC
            - In-call chat with emoji reactions (6 types)
            - Hand raise system with participant count
            - Real-time network quality monitoring
            - Call history with statistics
            - Screen sharing (host only)
            - Call recording (host only)
            - Offline-first PWA support
            - Beautiful Tailwind CSS UI
            
            ### 📋 Requirements
            - **OS:** Android 7.0+ (API 24+)
            - **Tested:** Android 12, 13, 14
            - **Storage:** 50MB+ free space
            - **Permissions:** Camera, Microphone, Network
            
            ### 📦 APK Details
            | Property | Value |
            |----------|-------|
            | **Size** | ~45-50 MB |
            | **App ID** | com.etchat.app |
            | **Target SDK** | 34 (Android 14) |
            | **Min SDK** | 24 (Android 7.0) |
            | **Type** | Debug APK |
            
            ### 🧪 Testing Checklist
            - [ ] Install APK successfully
            - [ ] Grant camera/microphone permissions
            - [ ] Generate call code
            - [ ] Share code with another device
            - [ ] Join call and verify video
            - [ ] Test chat messaging
            - [ ] Verify emoji reactions
            - [ ] Test hand raise feature
            - [ ] Check network quality indicator
            - [ ] Verify call history persistence
            
            ---
            Built automatically by GitHub Actions
